name: CI y Deploy

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Verificar sintaxis PHP
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - uses: actions/checkout@v4

      - name: Lint de todos los archivos .php
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l

  deploy:
    name: Deploy a produccion por FTPS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy por FTPS con lftp
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u \"\$FTP_USERNAME\",\"\$FTP_PASSWORD\" ftp.soloboticas.com;
          mirror --reverse --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude .htaccess \
            --exclude .env \
            --exclude .user.ini \
            --exclude-glob .well-known/ \
            --exclude-glob public/uploads/ \
            --exclude-glob db/migrations/ \
            --exclude-glob db/difference/ \
            --exclude-glob db/download/ \
            ./ ./
          "
